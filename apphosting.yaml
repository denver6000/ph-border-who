# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 10
  cpu: 1
  memoryMiB: 512

# Environment variables and secrets.
env:
  - variable: APP_ENV
    value: "prod"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_APP_ENV
    value: "prod"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyBB7DkBo5sBDVVXKXmqsNcImRahvpemCyg"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "bounds-finder.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "bounds-finder"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "bounds-finder.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "745700625215"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:745700625215:web:65c8c6895a7f47ef14218a"
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_PROJECT_ID
    value: "bounds-finder"
    availability:
      - BUILD
      - RUNTIME
  - variable: FIRESTORE_BOUNDARY_DATASET_ID
    value: "hdx-philippines-adm4"
    availability:
      - BUILD
      - RUNTIME

